name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the release automation
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Test the engine and validate the question banks
        run: ./gradlew :core:test --stacktrace

      - name: Build audio and glossary
        uses: ./.github/actions/build-assets

      - name: Build the release and preview APKs
        env:
          VERSION_NAME: pr${{ github.event.pull_request.number || 'manual' }}.${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
          ./gradlew :app:assembleRelease -Ppreview=true --stacktrace
          cp app/build/outputs/apk/release/app-release.apk open-jlpt-preview.apk
          ls -l open-jlpt-preview.apk

      - name: Upload the preview APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jlpt-preview
          path: open-jlpt-preview.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  # Puts each PR's tested APK on the rolling "preview" pre-release so it can be installed from a phone.
  publish-preview:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-jlpt-preview

      - name: Upload to the preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          asset="open-jlpt-pr${PR_NUMBER}-preview.apk"
          mv open-jlpt-preview.apk "$asset"
          if ! gh release view preview >/dev/null 2>&1; then
            gh release create preview --prerelease --latest=false --title "Open JLPT previews" \
              --notes "Test builds from open pull requests. They install as **Open JLPT Preview**, next to the normal app. Most people want the [latest release](https://github.com/${GH_REPO}/releases/latest) instead."
          fi
          gh release upload preview "$asset" --clobber
          echo "Published $asset"

  remove-preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete this PR's preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh release delete-asset preview "open-jlpt-pr${PR_NUMBER}-preview.apk" --yes || echo "No preview APK to delete."

name: Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the engine and validate the question banks
        run: ./gradlew :core:test --stacktrace

      - name: Build the release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk open-jlpt.apk

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Open JLPT ${{ env.VERSION_NAME }}
          body: |
            Download **open-jlpt.apk** below and open it on your Android phone (Android 8.0 or newer).
            If Android asks, allow installing apps from your browser. A new version installs over the old one and keeps your history.

            Built from ${{ github.sha }}.
          files: open-jlpt.apk
          make_latest: true
          fail_on_unmatched_files: true
